- hosts: all
  become: yes
  tasks:
    - name: install kitty terminfo
      apt:
        name: kitty-terminfo
  roles:
    - role: dhcp
    - role: tftp
    - role: https
      when: settings['networks'][0]['https']
    - role: http
    - role: ipxe
    - role: harvester
    - role: proxy
      when: settings['harvester']['airgapped']
