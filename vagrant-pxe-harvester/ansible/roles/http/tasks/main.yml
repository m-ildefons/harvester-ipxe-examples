---
- name: install nginx
  apt:
    update_cache: yes
    name: nginx
    state: present

- name: configure default site
  copy:
    src: default
    dest: /etc/nginx/sites-available
  notify: restart nginx

- name: enable default site
  file:
    src: /etc/nginx/sites-available/default
    dest: /etc/nginx/sites-enabled/default
    state: link
  notify: restart nginx

- name: set up additional artifacts
  include_tasks: _download_media.yml
  vars:
    media_url: "{{ item }}"
  loop: "{{ settings['pxe_server']['artifacts'] }}"
